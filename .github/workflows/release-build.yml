name: Release artifacts
on:
  push:
    tags: ['0.*']
permissions:
  contents: read
jobs:
  linux:
    name: Linux x86_64 release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Build and smoke-test the tagged CLI
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build-home --remap-path-prefix=$GITHUB_WORKSPACE=/codegate"
          cargo build --locked --release --bin codegate
          test "$(target/release/codegate --version)" = "codegate $GITHUB_REF_NAME"
          target/release/codegate evaluate --help
      - name: Package the binary and checksums
        run: |
          package="codegate-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$package"
          cp target/release/codegate README.md "dist/$package/"
          tar -czf "dist/$package.tar.gz" -C "dist/$package" codegate README.md
          cd dist
          sha256sum "$package.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codegate-release-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
