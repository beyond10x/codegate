domain: codegate_semantic.semantic
summary: Immutable observations and evidence-bounded analysis/navigation values for semantic contract v1; separate from dependency /0.1.
# Value records compose snapshots; identities are not persistent entities or
# lifecycle declarations. Referential and cross-record invariants are admitted
# by the future runtime, as specified in specifications/semantic-contract.md.
types:
  - {name: codegate_semantic.semantic.SnapshotId, kind: newtype, of: String}
  - {name: codegate_semantic.semantic.ConfigurationId, kind: newtype, of: String}
  - {name: codegate_semantic.semantic.FactId, kind: newtype, of: String}
  - {name: codegate_semantic.semantic.UnitId, kind: newtype, of: String}
  - {name: codegate_semantic.semantic.DeclarationId, kind: newtype, of: String}
  - {name: codegate_semantic.semantic.Language, kind: enum, variants: [Go, Rust, Java]}
  - {name: codegate_semantic.semantic.CollectionMode, kind: enum, variants: [SourceOnly, Semantic]}
  - {name: codegate_semantic.semantic.SourceClass, kind: enum, variants: [Production, Test, Generated, GeneratedTest, BuildConfiguration]}
  - {name: codegate_semantic.semantic.SourceOrigin, kind: enum, variants: [TrackedClean, TrackedDirty, Untracked, ExternalBuildEvidence]}
  - {name: codegate_semantic.semantic.BuildSystem, kind: enum, variants: [GoModules, Cargo, Maven, Gradle]}
  - {name: codegate_semantic.semantic.Resolution, kind: enum, variants: [SyntacticCandidate, Resolved, Unresolved]}
  - {name: codegate_semantic.semantic.ResolutionBasis, kind: enum, variants: [SourceStructure, LanguageServer, DeclaredFramework, MatchedBuildEvidence]}
  - {name: codegate_semantic.semantic.Completeness, kind: enum, variants: [Complete, Partial, Unsupported, Failed, NotApplicable]}
  - {name: codegate_semantic.semantic.FactFamily, kind: enum, variants: [Sources, Declarations, Occurrences, Dependencies, References, Implementations, Calls, Decisions, Structure, Documentation, Effects, Tests, FrameworkDeclarations, FrameworkWiring, ExecutionCoverage]}
  - {name: codegate_semantic.semantic.GapCode, kind: enum, variants: [InvalidFormat, InvalidFact, InvalidPolicy, IdentityMismatch, SourceChangedDuringCollection, MissingTool, ToolTimeout, ToolFailure, SyntaxError, MissingBuildSelection, UnknownUnit, UnresolvedSymbol, AmbiguousSymbol, DynamicDispatch, MacroExpansion, ConditionalCompilation, MissingClasspath, GeneratedSources, ProgrammaticLookup, AmbiguousInjection, AugmentationRequired, StaleEvidence, UnsupportedCapability, PartialCollection]}
  - {name: codegate_semantic.semantic.DeclarationKind, kind: enum, variants: [Package, Module, Namespace, Function, Method, Constructor, Type, Interface, Trait, Field, Variable, Parameter, Constant]}
  - {name: codegate_semantic.semantic.Visibility, kind: enum, variants: [Public, Protected, Package, Internal, Private, Unknown]}
  - {name: codegate_semantic.semantic.OccurrenceRole, kind: enum, variants: [Definition, Read, Write, TypeUse, Import, Invocation, Annotation, DocumentationReference]}
  - {name: codegate_semantic.semantic.LineClass, kind: enum, variants: [Code, Comment, Blank, Mixed]}
  - {name: codegate_semantic.semantic.ApiEligibility, kind: enum, variants: [Eligible, Ineligible, Unknown]}
  - {name: codegate_semantic.semantic.TestKind, kind: enum, variants: [Unit, Integration, TableDriven, Parameterized, Benchmark, Fuzz]}
  - {name: codegate_semantic.semantic.DependencyKind, kind: enum, variants: [Runtime, Build, Test]}
  - {name: codegate_semantic.semantic.DecisionKind, kind: enum, variants: [ConditionalBranch, Loop, CaseBranch, CatchBranch, ShortCircuitAnd, ShortCircuitOr, Ternary, GoSelectCase, RustTryPropagation]}
  - {name: codegate_semantic.semantic.StructureKind, kind: enum, variants: [Body, Parameter, ReturnStatement, NestingRegion, Field, InterfaceMember, PublicApiMember, Documentation, DebtMarker, NamingSignal, Loop, Allocation, TestCase]}
  - {name: codegate_semantic.semantic.EffectKind, kind: enum, variants: [DiscardedResult, AbruptExit, ProcessExecution, SqlConstruction, PathConstruction, UnsafeOperation, WeakCryptography, Reflection, Nondeterminism, GoDefer, GoUncheckedTypeAssertion, AllocationInLoop, StringConcatenationInLoop, MissingCapacity, LargeValueCopy]}
  - {name: codegate_semantic.semantic.FrameworkKind, kind: enum, variants: [Bean, Qualifier, Producer, InjectionPoint, InjectionCandidate, InjectionBinding, RestResource, RestRoute, TransactionDeclaration, ConfigurationReference]}
  - {name: codegate_semantic.semantic.MetricKind, kind: enum, variants: [FanIn, FanOut, FunctionLines, FileLines, CodeLines, Complexity, Nesting, Parameters, Returns, TypeMembers, InterfaceMembers, PublicApiSize, DocumentationRatio, DebtMarkers, NamingSignals, TestCount, TestSourceRatio, GeneratedSourceRatio, NondeterminismCount, EffectCount, ReferenceCount, CallFanIn, CallFanOut, ImplementationCount, FunctionCount, TypeCount, InterfaceCount, SymbolCount, FileCount, BranchDensity, ExecutionCoverage]}
  - {name: codegate_semantic.semantic.MetricAggregation, kind: enum, variants: [PerSubject, Total, Maximum, Mean, CountAboveThreshold]}
  - {name: codegate_semantic.semantic.Verdict, kind: enum, variants: [Pass, Fail, Incomplete, Unsupported, Error, NotApplicable]}
  - {name: codegate_semantic.semantic.Severity, kind: enum, variants: [Info, Warning, Error]}
  - {name: codegate_semantic.semantic.CheckKind, kind: enum, variants: [DependencyDirection, Layers, FanIn, FanOut, Cycles, TestBoundary, ForbiddenImport, ForbiddenCall, Effect, UnknownUnit, MetricThreshold, Framework]}
  - {name: codegate_semantic.semantic.QueryKind, kind: enum, variants: [Definitions, References, Implementations, Callers, Callees, FrameworkRelationships]}
  - {name: codegate_semantic.semantic.SelectorKind, kind: enum, variants: [Name, QualifiedName, SourcePosition]}
  - name: codegate_semantic.semantic.SourceRange
    kind: struct
    fields:
      - {name: path, type: String}
      - {name: start_byte, type: Integer}
      - {name: end_byte, type: Integer}
      - {name: start_line, type: Integer}
      - {name: start_column, type: Integer}
      - {name: end_line, type: Integer}
      - {name: end_column, type: Integer}
  - name: codegate_semantic.semantic.SourceLine
    kind: struct
    fields:
      - {name: number, type: Integer}
      - {name: start_byte, type: Integer}
      - {name: end_byte, type: Integer}
      - {name: classification, type: codegate_semantic.semantic.LineClass}
  - name: codegate_semantic.semantic.SourceFile
    kind: struct
    fields:
      - {name: path, type: String}
      - {name: content_sha256, type: String}
      - {name: byte_length, type: Integer}
      - {name: language, type: 'Optional<codegate_semantic.semantic.Language>'}
      - {name: classification, type: codegate_semantic.semantic.SourceClass}
      - {name: origin, type: codegate_semantic.semantic.SourceOrigin}
