[package]
name = "codegate-cli"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "codegate"

[[bin]]
name = "codegate"
path = "src/main.rs"

[dependencies]
codegate-behavior = { package = "codegate", path = "generated/behavior" }
codegate-contract = { path = "generated/wire" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = "=0.11.0"

[dev-dependencies]
ess-conformance = { git = "https://github.com/beyond10x/ess", rev = "8700d0808e8f3b19711629d8a17afc5281680f58" }
ess-primitives = { git = "https://github.com/beyond10x/ess", rev = "8700d0808e8f3b19711629d8a17afc5281680f58" }
